<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | DeformShader</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      :root {
        --bg-deep:    #0a0c10;
        --bg-panel:   #111418;
        --bg-card:    #181c22;
        --border:     #252b35;
        --border-act: #3a8fd4;
        --accent:     #3a8fd4;
        --accent-glow:rgba(58,143,212,0.22);
        --text-pri:   #e8ecf0;
        --text-sec:   #7a8694;
        --text-mut:   #4a5260;
        --btn-bg:     #1c2230;
        --btn-hover:  #243044;
        --btn-act-bg: #1a3a5c;
        --success:    #3ad48a;
        --warning:    #d4c33a;
        --danger:     #d45a3a;
        --panel-w:    210px;
        --ctrl-w:     196px;
        --footer-h:   38px;
      }

      html, body {
        width: 100vw; height: 100vh;
        overflow: hidden;
        background: var(--bg-deep);
        font-family: 'Noto Sans KR', sans-serif;
        font-size: 13px;
        color: var(--text-pri);
      }

      ::-webkit-scrollbar { width: 4px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

      #app-layout {
        display: flex;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }

      /* ══ ① 제품 리스트 ══ */
      #panel-products {
        width: var(--panel-w);
        min-width: var(--panel-w);
        max-width: var(--panel-w);
        height: 100vh;
        background: var(--bg-panel);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
        z-index: 20;
      }

      .panel-header {
        padding: 14px 12px 10px;
        border-bottom: 1px solid var(--border);
        display: flex; align-items: center; gap: 7px;
        flex-shrink: 0;
      }
      .panel-header .dot {
        width: 6px; height: 6px; border-radius: 50%;
        background: var(--accent); box-shadow: 0 0 6px var(--accent);
        flex-shrink: 0;
      }
      .panel-header h2 {
        font-size: 11px; font-weight: 700;
        letter-spacing: 0.09em; text-transform: uppercase; color: var(--text-pri);
      }
      .panel-header .badge {
        margin-left: auto;
        font-family: 'JetBrains Mono', monospace; font-size: 10px;
        color: var(--text-mut); background: var(--bg-card);
        padding: 1px 6px; border-radius: 10px; border: 1px solid var(--border);
      }

      .product-search { padding: 8px 10px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
      .product-search input {
        width: 100%; background: var(--bg-card); border: 1px solid var(--border);
        border-radius: 4px; padding: 5px 9px; color: var(--text-pri);
        font-size: 11px; font-family: 'Noto Sans KR', sans-serif;
        outline: none; transition: border-color 0.2s;
      }
      .product-search input::placeholder { color: var(--text-mut); }
      .product-search input:focus { border-color: var(--accent); }

      #product-list {
        flex: 1; overflow-y: auto;
        padding: 7px 8px; display: flex; flex-direction: column; gap: 3px;
      }

      /* 로딩 대기 메시지 */
      .list-empty {
        text-align: center;
        padding: 30px 10px;
        color: var(--text-mut);
        font-size: 11px;
        line-height: 1.8;
      }
      .list-empty .empty-icon { font-size: 22px; margin-bottom: 8px; opacity: 0.3; }

      .product-btn {
        width: 100%; background: var(--btn-bg); border: 1px solid var(--border);
        border-radius: 4px; padding: 8px 10px; color: var(--text-sec);
        font-size: 11px; font-family: 'Noto Sans KR', sans-serif;
        cursor: pointer; display: flex; align-items: center; gap: 7px;
        transition: all 0.14s ease; text-align: left; position: relative; overflow: hidden;
      }
      .product-btn::before {
        content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 2px;
        background: var(--accent); transform: scaleY(0); transition: transform 0.14s;
      }
      .product-btn:hover { background: var(--btn-hover); border-color: var(--border-act); color: var(--text-pri); }
      .product-btn:hover::before { transform: scaleY(1); }
      .product-btn.active { background: var(--btn-act-bg); border-color: var(--border-act); color: var(--accent); }
      .product-btn.active::before { transform: scaleY(1); }

      .prod-icon {
        width: 18px; height: 18px; border-radius: 3px;
        background: var(--bg-card); border: 1px solid var(--border);
        display: flex; align-items: center; justify-content: center;
        flex-shrink: 0; font-size: 9px; color: var(--text-mut);
        font-family: 'JetBrains Mono', monospace;
      }
      .product-btn.active .prod-icon { background: var(--accent-glow); border-color: var(--accent); color: var(--accent); }
      .prod-name { flex: 1; font-weight: 500; }

      /* category 뱃지 */
      .prod-category {
        font-size: 8px;
        font-family: 'JetBrains Mono', monospace;
        padding: 1px 4px;
        border-radius: 2px;
        background: var(--bg-card);
        border: 1px solid var(--border);
        color: var(--text-mut);
        flex-shrink: 0;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .product-btn.active .prod-category { border-color: var(--accent); color: var(--accent); }

      .placed-dot {
        width: 5px; height: 5px; border-radius: 50%;
        background: var(--success); opacity: 0; transition: opacity 0.2s; flex-shrink: 0;
      }
      .product-btn.placed .placed-dot { opacity: 1; }

      .list-footer {
        padding: 8px 10px; border-top: 1px solid var(--border);
        display: flex; gap: 5px; flex-shrink: 0;
      }
      .list-footer button {
        flex: 1; padding: 5px; font-size: 10px;
        font-family: 'Noto Sans KR', sans-serif; border-radius: 3px;
        border: 1px solid var(--border); background: var(--bg-card);
        color: var(--text-sec); cursor: pointer; transition: all 0.14s;
      }
      .list-footer button:hover { border-color: var(--accent); color: var(--accent); }

      /* ══ ② 편의기능 ══ */
      #panel-controls {
        width: var(--ctrl-w); min-width: var(--ctrl-w); max-width: var(--ctrl-w);
        height: 100vh; background: var(--bg-panel); border-right: 1px solid var(--border);
        display: flex; flex-direction: column; overflow-y: auto;
        flex-shrink: 0; z-index: 20;
      }

      .ctrl-section { padding: 10px 9px 8px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
      .ctrl-section:last-child { border-bottom: none; }
      .ctrl-title {
        font-size: 9px; font-weight: 700; letter-spacing: 0.13em;
        text-transform: uppercase; color: var(--text-mut); margin-bottom: 7px;
      }
      .ctrl-info {
        font-size: 10px; color: var(--text-sec); background: var(--bg-card);
        padding: 5px 9px; border-radius: 3px; border: 1px solid var(--border);
        margin-bottom: 5px; font-family: 'JetBrains Mono', monospace;
        display: flex; justify-content: space-between;
      }
      .ctrl-info span { color: var(--accent); }

      .ctrl-btn {
        width: 100%; padding: 7px 9px; margin-bottom: 3px;
        border-radius: 4px; border: 1px solid var(--border); background: var(--btn-bg);
        color: var(--text-sec); font-size: 11px; font-family: 'Noto Sans KR', sans-serif;
        cursor: pointer; text-align: left; display: flex; align-items: center; gap: 7px;
        transition: all 0.14s;
      }
      .ctrl-btn:last-child { margin-bottom: 0; }
      .ctrl-icon { font-size: 12px; flex-shrink: 0; opacity: 0.65; }
      .ctrl-btn:hover { background: var(--btn-hover); border-color: var(--border-act); color: var(--text-pri); }
      .ctrl-btn:hover .ctrl-icon { opacity: 1; }
      .ctrl-btn:active { transform: scale(0.98); }
      .ctrl-btn.is-on  { background: rgba(58,212,138,0.08); border-color: var(--success); color: var(--success); }
      .ctrl-btn.is-off { background: rgba(212,90,58,0.08);  border-color: var(--danger);  color: var(--danger); }
      .ctrl-btn.is-primary { background: rgba(58,143,212,0.1); border-color: var(--accent); color: var(--accent); }
      .state-badge {
        margin-left: auto; font-size: 9px; font-family: 'JetBrains Mono', monospace;
        padding: 1px 5px; border-radius: 3px; font-weight: 700;
      }
      .is-on  .state-badge { background: rgba(58,212,138,0.15); color: var(--success); }
      .is-off .state-badge { background: rgba(212,90,58,0.15);  color: var(--danger); }

      /* ══ ③ Unity 영역 ══ */
      #unity-wrapper {
        flex: 1 1 0%;
        min-width: 0;
        height: 100vh;
        position: relative;
        overflow: hidden;
        background: #000;
        display: flex;
        flex-direction: column;
      }
      #unity-container { position: relative; flex: 1; overflow: hidden; }
      #unity-canvas    { display: block; }

      #unity-loading-bar {
        display: none; position: absolute;
        left: 50%; top: 50%; transform: translate(-50%, -50%);
        text-align: center; z-index: 5;
      }
      #unity-logo {
        width: 154px; height: 130px;
        background: url('TemplateData/unity-logo-dark.png') no-repeat center;
        background-size: contain; margin: 0 auto 20px;
      }
      #unity-progress-bar-empty {
        width: 141px; height: 18px;
        background: url('TemplateData/progress-bar-empty-dark.png') no-repeat center;
        background-size: contain; margin: 0 auto; position: relative;
      }
      #unity-progress-bar-full {
        position: absolute; left: 0; top: 0; width: 0%; height: 100%;
        background: url('TemplateData/progress-bar-full-dark.png') no-repeat left;
        background-size: contain;
      }
      #unity-warning { position: absolute; top: 0; left: 0; right: 0; z-index: 10; }

      #unity-footer {
        height: var(--footer-h); background: #111;
        border-top: 1px solid var(--border);
        display: flex; align-items: center; padding: 0 10px; flex-shrink: 0;
      }
      #unity-build-title {
        color: #666; font-size: 11px; margin-left: auto;
        font-family: 'JetBrains Mono', monospace;
      }
      #unity-fullscreen-button {
        width: 24px; height: 24px; margin-left: 8px; cursor: pointer;
        background: url('TemplateData/fullscreen-button.png') no-repeat center;
        background-size: contain; opacity: 0.5; transition: opacity 0.15s;
      }
      #unity-fullscreen-button:hover { opacity: 1; }
      #unity-logo-title-footer {
        width: 16px; height: 16px;
        background: url('TemplateData/unity-logo-title.png') no-repeat center;
        background-size: contain; opacity: 0.4;
      }

      #toast-container {
        position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
        display: flex; flex-direction: column; gap: 5px;
        z-index: 9999; pointer-events: none;
      }
      .toast {
        background: var(--bg-card); border: 1px solid var(--border);
        border-left: 3px solid var(--accent); border-radius: 4px;
        padding: 7px 14px; font-size: 11px; color: var(--text-sec); white-space: nowrap;
        animation: toastIn 0.2s ease, toastOut 0.3s ease 2s forwards;
      }
      .toast.success { border-left-color: var(--success); }
      .toast.warn    { border-left-color: var(--warning); }
      @keyframes toastIn  { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
      @keyframes toastOut { from{opacity:1} to{opacity:0} }
    </style>
  </head>
  <body>

    <div id="app-layout">

      <!-- ① 제품 리스트 -->
      <div id="panel-products">
        <div class="panel-header">
          <div class="dot"></div>
          <h2>제품 배치</h2>
          <div class="badge" id="product-count">0</div>
        </div>
        <div class="product-search">
          <input type="text" id="search-input" placeholder="제품 검색..." oninput="filterProducts(this.value)">
        </div>
        <div id="product-list">
          <!-- Unity가 LoadJson 호출 전까지 대기 메시지 표시 -->
          <div class="list-empty">
            <div class="empty-icon">⧖</div>
            Unity 로딩 대기 중...<br>
            <small>제품 목록은 Unity가<br>데이터를 전달하면 표시됩니다</small>
          </div>
        </div>
        <div class="list-footer">
          <button onclick="selectAllProducts()">전체 선택</button>
          <button onclick="clearSelection()">선택 해제</button>
        </div>
      </div>

      <!-- ② 편의기능 -->
      <div id="panel-controls">
        <div class="ctrl-section">
          <div class="ctrl-title">포장공간비율</div>
          <div class="ctrl-info">사용률 <span id="space-ratio">0%</span></div>
          <div class="ctrl-info">배치 수 <span id="placed-count">0 / 0</span></div>
        </div>
        <div class="ctrl-section">
          <div class="ctrl-title">편의기능</div>
          <button class="ctrl-btn is-on" id="btn-grid-on" onclick="setProductGrid(true)">
            <span class="ctrl-icon">⊞</span> 제품 그리드 On
            <span class="state-badge">ON</span>
          </button>
          <button class="ctrl-btn" id="btn-grid-off" onclick="setProductGrid(false)">
            <span class="ctrl-icon">⊟</span> 제품 그리드 Off
          </button>
          <button class="ctrl-btn" onclick="resetCamera()">
            <span class="ctrl-icon">⌖</span> 카메라 위치 초기화
          </button>
          <button class="ctrl-btn is-primary" onclick="savePrintImage()">
            <span class="ctrl-icon">🖨</span> 프린트 이미지저장
          </button>
          <button class="ctrl-btn is-primary" onclick="exportPrompt()">
            <span class="ctrl-icon">✦</span> 프롬프트 내보내기
          </button>
        </div>
        <div class="ctrl-section">
          <div class="ctrl-title">정렬</div>
          <button class="ctrl-btn" onclick="sortProducts('BigSideSmallCenter')">  <span class="ctrl-icon">⇌</span> 제품정렬-대칭</button>
          <button class="ctrl-btn" onclick="sortProducts('MountainPeak')">        <span class="ctrl-icon">◉</span> 제품정렬-중앙대큰산</button>
          <button class="ctrl-btn" onclick="sortProducts('ValleyDip')">           <span class="ctrl-icon">▲</span> 제품정렬-골짜기모양</button>
          <button class="ctrl-btn" onclick="sortProducts('RandomShuffle')">       <span class="ctrl-icon">⁑</span> 제품정렬-무작위</button>
          <button class="ctrl-btn" onclick="sortProducts('SizeAscending')">       <span class="ctrl-icon">↑</span> 제품정렬-오름차순작큰</button>
          <button class="ctrl-btn" onclick="sortProducts('SizeDescending')">      <span class="ctrl-icon">↓</span> 제품정렬-내림차순큰작</button>
        </div>
      </div>

      <!-- ③ Unity -->
      <div id="unity-wrapper">
        <div id="unity-container">
          <canvas id="unity-canvas" tabindex="-1"></canvas>
          <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-empty">
              <div id="unity-progress-bar-full"></div>
            </div>
          </div>
          <div id="unity-warning"></div>
        </div>
        <div id="unity-footer">
          <div id="unity-logo-title-footer"></div>
          <div id="unity-build-title">DeformShader</div>
          <div id="unity-fullscreen-button"></div>
        </div>
      </div>

    </div>

    <div id="toast-container"></div>

    <!-- ══ Unity 캔버스 크기 관리 ══ -->
    <script>
      var PANEL_W  = 210;
      var CTRL_W   = 196;
      var FOOTER_H = 38;

      function resizeUnity() {
        var container = document.getElementById('unity-container');
        var canvas    = document.getElementById('unity-canvas');
        if (!container || !canvas) return;
        var W = window.innerWidth  - PANEL_W - CTRL_W;
        var H = window.innerHeight - FOOTER_H;
        if (W < 1) W = 1;
        if (H < 1) H = 1;
        canvas.width  = W; canvas.height = H;
        canvas.style.width  = W + 'px';
        canvas.style.height = H + 'px';
        container.style.width  = W + 'px';
        container.style.height = H + 'px';
      }
      window.addEventListener('resize', resizeUnity);
    </script>

    <!-- ══ Unity 로더 ══ -->
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var myGameInstance = null;

      resizeUnity();

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() { warningBanner.removeChild(div); updateBannerVisibility(); }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/BuildVolume.loader.js";
      var config = {
        arguments: [],
        dataUrl:      buildUrl + "/BuildVolume.data.unityweb",
        frameworkUrl: buildUrl + "/BuildVolume.framework.js.unityweb",
        codeUrl:      buildUrl + "/BuildVolume.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName:    "DefaultCompany",
        productName:    "DeformShader",
        productVersion: "0.1.0",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function() {
        createUnityInstance(canvas, config, function(progress) {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then(function(unityInstance) {
          myGameInstance = unityInstance;
          window.unityInstance = unityInstance;
          document.querySelector("#unity-loading-bar").style.display = "none";
          document.querySelector("#unity-fullscreen-button").onclick = function() {
            unityInstance.SetFullscreen(1);
          };
          resizeUnity();
        }).catch(function(message) { alert(message); });
      };
      document.body.appendChild(script);
    </script>

    <!-- ══ 웹 UI 로직 ══ -->
    <script>
      var STATE = {
        products: [], selectedIds: new Set(), placedIds: new Set(), gridOn: true,
      };
      var UNITY_OBJ = 'WebBridge';

      function sendToUnity(method, payload) {
        var msg = typeof payload === 'object' ? JSON.stringify(payload) : String(payload == null ? '' : payload);
        if (window.unityInstance) window.unityInstance.SendMessage(UNITY_OBJ, method, msg);
        console.log('[→Unity]', method, payload);
      }

      // Unity → Web 콜백
      window.OnUnityProductPlaced = function(jsonStr) {
        var data = JSON.parse(jsonStr);
        STATE.placedIds.add(data.productId);
        refreshPlacedUI();
        showToast(data.productId + ' 배치 완료', 'success');
      };
      window.OnUnitySpaceRatio = function(jsonStr) {
        var data = JSON.parse(jsonStr);
        document.getElementById('space-ratio').textContent = (data.ratio * 100).toFixed(1) + '%';
      };

      /* ══════════════════════════════════════════════
         LoadJson(mystrJson)
         ──────────────────────────────────────────────
         Unity C# 에서 호출하는 방법:
           Application.ExternalCall("LoadJson", jsonString);

         받는 JSON 포맷 (ProductDataListJson.json):
         {
           "productDataList": [
             {
               "productName": "Product-1",
               "bundleURL":   "/ModelFile/xxx.unity3d",
               "bundleName":  "xxx",
               "ThumbnailURL":"xxx",
               "category":    "bottle"
             }, ...
           ]
         }
      ══════════════════════════════════════════════ */
      function LoadJson(mystrJson) {
        try {
          var parsed = JSON.parse(mystrJson);
          var list   = parsed.productDataList;

          if (!Array.isArray(list) || list.length === 0) {
            console.warn('[LoadJson] productDataList가 비어 있거나 없습니다.');
            return;
          }

          // Unity JSON 필드 → 내부 STATE 포맷 변환
          var products = list.map(function(item, idx) {
            return {
              id:          item.bundleName,    // Unity SendMessage 식별 키
              name:        item.productName,   // 버튼 표시 이름
              bundleURL:   item.bundleURL,
              bundleName:  item.bundleName,
              modelName:item.modelName,
              category:    item.category || ''
            };
          });

          // 리스트 갱신
          loadProducts(products);

          console.log('[LoadJson] 제품 ' + products.length + '개 로드 완료');
          showToast('제품 ' + products.length + '개 로드됨', 'success');

        } catch (e) {
          console.error('[LoadJson] JSON 파싱 오류:', e);
          showToast('JSON 파싱 오류', 'warn');
        }
      }
      // ExternalCall 방식 전역 노출
      window.LoadJson = LoadJson;

      /* ── 내부: 제품 리스트 갱신 ── */
      function loadProducts(data) {
        STATE.products = data;
        renderList(data);
        document.getElementById('product-count').textContent = data.length;
        document.getElementById('placed-count').textContent  = '0 / ' + data.length;
      }

      function renderList(products) {
        var list = document.getElementById('product-list');
        list.innerHTML = '';

        if (!products || products.length === 0) {
          list.innerHTML = '<div class="list-empty"><div class="empty-icon">⧖</div>Unity 로딩 대기 중...<br><small>제품 목록은 Unity가<br>데이터를 전달하면 표시됩니다</small></div>';
          return;
        }

        products.forEach(function(p, i) {
          var btn = document.createElement('button');
          btn.className = 'product-btn';
          btn.dataset.id = p.id;
          btn.innerHTML =
            '<span class="prod-icon">' + String(i + 1).padStart(2, '0') + '</span>' +
            '<span class="prod-name">'  + p.name + '</span>' +
            (p.category ? '<span class="prod-category">' + p.category + '</span>' : '');
          btn.onclick = function() { spawnProduct(p.bundleURL, p.bundleName,p.category,p.modelName); };
          list.appendChild(btn);
        });
      }

      // 버튼 클릭 → Unity에 제품 생성 명령만 전달 (선택 상태 없음)
      function spawnProduct(id, bundleName,category,modelName) {
        if (myGameInstance) {
          var str = id+"|"+bundleName+"|"+category+"|"+modelName;
          console.log("str:"+str);
          myGameInstance.SendMessage('ProductManager', 'ClickProduct', str);
        }
        console.log('[→Unity] OnProductSelected', bundleName);
        showToast(id + ' 생성 요청', 'success');

       
      }

      function selectAllProducts() {
        // 전체 제품 일괄 생성
        STATE.products.forEach(function(p) {
          if (myGameInstance) myGameInstance.SendMessage('ProductManager', 'OnProductSelected', p.bundleName);
        });
        showToast('전체 제품 생성 요청', 'success');
      }

      function clearSelection() {
        if (myGameInstance) myGameInstance.SendMessage('ProductManager', 'OnSelectionCleared', '');
        showToast('선택이 해제되었습니다');
      }

      function filterProducts(q) {
        q = q.trim().toLowerCase();
        var filtered = q
          ? STATE.products.filter(function(p) {
              return p.name.toLowerCase().indexOf(q) >= 0
                  || p.id.toLowerCase().indexOf(q) >= 0
                  || (p.category && p.category.toLowerCase().indexOf(q) >= 0);
            })
          : STATE.products;
        renderList(filtered);
      }

      /* ── 편의기능 ── */
      function setProductGrid(on) {
        STATE.gridOn = on;
        var btnOn  = document.getElementById('btn-grid-on');
        var btnOff = document.getElementById('btn-grid-off');
        btnOn.className  = 'ctrl-btn' + (on  ? ' is-on'  : '');
        btnOff.className = 'ctrl-btn' + (!on ? ' is-off' : '');
        btnOn.innerHTML  = '<span class="ctrl-icon">⊞</span> 제품 그리드 On'  + (on  ? '<span class="state-badge">ON</span>'  : '');
        btnOff.innerHTML = '<span class="ctrl-icon">⊟</span> 제품 그리드 Off' + (!on ? '<span class="state-badge">OFF</span>' : '');
        showToast('제품 그리드 ' + (on ? 'ON' : 'OFF'));
        if (myGameInstance) myGameInstance.SendMessage('ProductManager', on ? 'ClickProductGridOn' : 'ClickProductGridOff');
      }

      function resetCamera() {
        showToast('카메라 초기화 중...');
        if (myGameInstance) myGameInstance.SendMessage('BoxVolumeManager', 'ClickResetCamPos');
      }

      function savePrintImage() {
        showToast('이미지 저장 요청됨', 'success');
        if (myGameInstance) myGameInstance.SendMessage('A4Print', 'CaptureA4LandscapeWhite');
      }

      function exportPrompt() {
        var data = {
          selectedProducts: Array.from(STATE.selectedIds),
          placedProducts:   Array.from(STATE.placedIds),
          gridEnabled:      STATE.gridOn,
          timestamp:        new Date().toISOString(),
        };
        if (navigator.clipboard) {
          navigator.clipboard.writeText(JSON.stringify(data, null, 2))
            .then(function() { showToast('클립보드에 복사됨', 'success'); })
            .catch(function() { showToast('프롬프트 내보내기 완료'); });
        } else {
          showToast('프롬프트 내보내기 완료');
        }
      }

      function sortProducts(type) {
        var LABELS = {
          'BigSideSmallCenter':'대칭 정렬', 'MountainPeak':'중앙대큰산 정렬',
          'ValleyDip':'골짜기모양 정렬',    'RandomShuffle':'무작위 정렬',
          'SizeAscending':'오름차순 정렬',  'SizeDescending':'내림차순 정렬'
        };
        showToast((LABELS[type] || type) + ' 적용됨', 'success');
        if (myGameInstance) myGameInstance.SendMessage('ProductManager', 'ClickProductLineup', type);
      }

      function showToast(msg, type) {
        var c = document.getElementById('toast-container');
        var t = document.createElement('div');
        t.className = 'toast' + (type ? ' ' + type : '');
        t.textContent = msg;
        c.appendChild(t);
        setTimeout(function() { if (t.parentNode) t.parentNode.removeChild(t); }, 2600);
      }
    </script>

  </body>
</html>
